[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wmtm"
version = "0.7.0rc2"
description = "Working Medium-Term Memory (WMTM): mutable active memory layer between STM and LTM"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Benjamin Goertzel", email = "ben@singularitynet.io" }]
dependencies = ["numpy"]

[project.optional-dependencies]
# M-09: optional extra for recall_semantic (off by default).  Pinned; the model revision is pinned in
# wmtm/embed_index.py (PINNED_REVISION) and cached by scripts/cache_embed_model.py.  Install CPU-only torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e .[embed]
embed = ["sentence-transformers==6.3.0"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["wmtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
